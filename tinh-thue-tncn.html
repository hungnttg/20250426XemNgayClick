<body>

    <a href="/tinh-thue-tncn">Tính Thuế TNCN</a>

  <div class="container">
    <h1>Tính Thuế Thu Nhập Cá Nhân (TNCN)</h1>
    <label for="income">Tổng thu nhập năm (triệu VND):</label>
    <input type="text" id="income" placeholder="Ví dụ: 350.000.000">

    <label for="insurance">Tổng tiền bảo hiểm đã đóng (triệu VND):</label>
    <input type="text" id="insurance" placeholder="Ví dụ: 8.000.000">

    <label for="dependents">Số người phụ thuộc:</label>
    <input type="number" id="dependents" min="0">

    <button onclick="calculateTax()">Tính thuế</button>

    <div class="error" id="error"></div>
    <div class="result" id="result"></div>
    <div class="explanation" id="explanation"></div>
  </div>

  <script>
    function parseNumber(str) {
      if (!/^[\d.]+(,\d+)?$/.test(str.trim())) return NaN;
      return parseFloat(str.replaceAll('.', '').replace(',', '.')) / 1e6;
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    }

    function calculateTax() {
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      const rawIncome = document.getElementById("income").value;
      const rawInsurance = document.getElementById("insurance").value;

      const income = parseNumber(rawIncome);
      const insurance = parseNumber(rawInsurance);
      const dependents = parseInt(document.getElementById("dependents").value) || 0;

      if (isNaN(income) || isNaN(insurance)) {
        errorEl.textContent = "Vui lòng nhập đúng định dạng số cho thu nhập và bảo hiểm (ví dụ: 350.000.000).";
        document.getElementById("result").innerHTML = "";
        document.getElementById("explanation").innerHTML = "";
        return;
      }

      const deductionSelf = 11 * 12;
      const deductionPerDependent = 4.4 * 12;

      const totalDeduction = deductionSelf + deductionPerDependent * dependents;
      const taxableIncome = Math.max(0, income - insurance - totalDeduction);

      const brackets = [
        { limit: 60, rate: 0.05 },
        { limit: 120, rate: 0.1 },
        { limit: 216, rate: 0.15 },
        { limit: 384, rate: 0.2 },
        { limit: 624, rate: 0.25 },
        { limit: 960, rate: 0.3 },
        { limit: Infinity, rate: 0.35 }
      ];

      let remaining = taxableIncome;
      let previousLimit = 0;
      let tax = 0;
      let breakdown = "";

      for (const bracket of brackets) {
        if (remaining <= 0) break;
        const amountAtRate = Math.min(bracket.limit - previousLimit, remaining);
        const taxAtRate = amountAtRate * bracket.rate;
        tax += taxAtRate;
        breakdown += `+ ${formatNumber(amountAtRate)} × ${bracket.rate * 100}% = ${formatNumber(taxAtRate)} triệu đồng<br>`;
        remaining -= amountAtRate;
        previousLimit = bracket.limit;
      }

      document.getElementById("result").innerHTML =
        taxableIncome > 0
          ? `<strong>Số tiền thuế phải nộp:</strong> ${formatNumber(tax)} triệu VND`
          : "<strong>Không phải nộp thuế.</strong>";

      document.getElementById("explanation").innerHTML = `
        <strong>Giải thích chi tiết:</strong>
        Tổng thu nhập: <strong>${formatNumber(income)}</strong> triệu đồng.<br>
        Bảo hiểm đã đóng: <strong>${formatNumber(insurance)}</strong> triệu đồng.<br>
        Giảm trừ bản thân: <strong>${formatNumber(deductionSelf)}</strong> triệu đồng.<br>
        Giảm trừ người phụ thuộc (${dependents} người): <strong>${formatNumber(deductionPerDependent * dependents)}</strong> triệu đồng.<br>
        <strong>Thu nhập tính thuế:</strong> ${formatNumber(taxableIncome)} triệu đồng.<br>
        <div class="breakdown">
        <strong>Chi tiết tính thuế:</strong><br>
        ${breakdown}</div>
        <em>Thuế TNCN được tính theo biểu thuế lũy tiến từng phần, tức là phần thu nhập nằm trong mỗi khoảng sẽ bị đánh thuế theo mức thuế suất tương ứng.</em>
      `;
    }
  </script>
